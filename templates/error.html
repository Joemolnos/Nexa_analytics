<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Nexa Analytics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center min-vh-100 p-4">
        <div class="card border-0 shadow-lg" style="max-width: 500px;">
            <div class="card-body text-center p-5">
                <div class="mb-4">
                    <div class="rounded-circle bg-danger bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-3">Oops! Something went wrong</h2>
                    <div class="alert alert-danger border-0 bg-danger bg-opacity-10">
                        <p class="mb-0">{{ error }}</p>
                    </div>
                    <p class="text-muted mb-4">We apologize for the inconvenience. Please try again or contact support if the problem persists.</p>
                </div>
                <div class="d-grid gap-3">
                    <a href="{{ url_for('upload_page') }}" class="btn btn-primary">
                        <i class="bi bi-cloud-upload me-2"></i>Back to Upload
                    </a>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-2"></i>Return to Home
                    </a>
                </div>
            </div>
            <div class="card-footer bg-light text-center p-3">
                <a href="#" class="text-decoration-none text-muted small">
                    <i class="bi bi-question-circle me-1"></i>Need help? Contact support
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
